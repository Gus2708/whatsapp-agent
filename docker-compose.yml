networks:
  agent_net:
    driver: bridge

volumes:
  n8n_data:
    external: true
  n8n_pgdata:
    external: true
  waha_session_storage:

services:
  waha:
    image: devlikeapro/waha:latest
    container_name: ${WAHA_CONTAINER_NAME:-waha_agent}
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      agent_net:
        aliases:
          - waha
          - waha_agent
          - waha_serrucho
    environment:
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WHATSAPP_SWAGGER_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WHATSAPP_SWAGGER_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_API_KEY=${WAHA_API_KEY}
      # WEBJS tiene problemas en Docker Linux. NOWEB es más estable en contenedores.
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      # Reinicia automáticamente las sesiones guardadas al (re)arrancar el contenedor.
      # Combinado con restart:unless-stopped y la auth persistida en el volumen,
      # la sesión "default" vuelve a WORKING sola sin re-escanear el QR.
      - WHATSAPP_RESTART_ALL_SESSIONS=True
      # Store de NOWEB: necesario para historial/contactos y mayor estabilidad de sesión.
      - WHATSAPP_DEFAULT_CONFIG_NOWEB_STORE_ENABLED=True
      - WHATSAPP_DEFAULT_CONFIG_NOWEB_STORE_FULLSYNC=True
      # OJO: el webhook NO se define aquí. La sesión "default" ya lo tiene persistido
      # en el volumen (/app/.sessions/noweb/default/.waha.session.config.json) con
      # url=http://host.docker.internal:5678/webhook/whatsapp/inbound y events=[message.any].
      # Se usa host.docker.internal (no el nombre de contenedor) porque WAHA rechaza hostnames
      # con guion bajo; esta ruta alcanza n8n por el puerto publicado en el host.
      #
      # WHATSAPP_HOOK_URL/WHATSAPP_HOOK_EVENTS se retiraron el 2026-08-13: el hook global
      # del env se SUMA al de la sesión, así que WAHA entregaba CADA evento DOS veces
      # (mismo event.id, dos POST) y n8n ejecutaba el workflow por duplicado.
      # Si algún día hay que recrear la sesión desde cero, defínelo en la sesión
      # (API/dashboard), no aquí, para no volver a duplicar.
      #
      # message.any incluye los mensajes SALIENTES (fromMe): necesario para detectar
      # cuando un empleado le escribe al cliente desde el mismo WhatsApp (handoff humano).
      # El bot ignora sus propios salientes vía la tabla mensajes_bot (nodo Detectar Handoff Empleado).
      - WHATSAPP_DOWNLOAD_MEDIA=true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1200m
    volumes:
      - waha_session_storage:/app/.sessions

  postgres:
    image: postgres:16-alpine
    container_name: ${N8N_PG_CONTAINER_NAME:-n8n_postgres}
    restart: unless-stopped
    networks:
      agent_net:
        aliases:
          - postgres
          - n8n_postgres
          - n8n_postgres_serrucho
    environment:
      - POSTGRES_DB=${N8N_PG_DATABASE:-n8n}
      - POSTGRES_USER=${N8N_PG_USER:-n8n}
      - POSTGRES_PASSWORD=${N8N_PG_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "max_connections=60", "-c", "shared_buffers=128MB", "-c", "effective_cache_size=256MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-n8n} -d $${POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    volumes:
      - n8n_pgdata:/var/lib/postgresql/data

  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${N8N_CONTAINER_NAME:-n8n_agent}
    restart: unless-stopped
    ports:
      - "5678:5678"
    networks:
      agent_net:
        aliases:
          - n8n
          - n8n_agent
          - n8n_serrucho
    depends_on:
      waha:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - AGENT_NAME=${AGENT_NAME:-Sales Agent}
      - BOT_NAME=${BOT_NAME:-${AGENT_NAME:-Sales Agent}}
      - BOT_ROLE=${BOT_ROLE:-asesor comercial}
      - BOT_EMOJIS=${BOT_EMOJIS:-👨🏻‍🔧 🪚}
      - STORE_NAME=${STORE_NAME:-Commerce Store}
      - STORE_SHORT_NAME=${STORE_SHORT_NAME:-Tienda}
      - STORE_LOCATION=${STORE_LOCATION:-Main Branch}
      - STORE_CITY=${STORE_CITY:-Mene Mauroa}
      - STORE_STATE=${STORE_STATE:-Estado Falcón}
      - STORE_COUNTRY=${STORE_COUNTRY:-Venezuela}
      - STORE_HOURS=${STORE_HOURS:-${STORE_SCHEDULE:-Mon-Sat 8:00 AM - 6:00 PM}}
      - STORE_DELIVERY_POLICY=${STORE_DELIVERY_POLICY:-}
      - STORE_PAYMENTS=${STORE_PAYMENTS:-}
      - STORE_RETURNS=${STORE_RETURNS:-}
      - STORE_CURRENCY=${STORE_CURRENCY:-USD}
      - WAHA_INTERNAL_URL=${WAHA_INTERNAL_URL:-http://waha:3000}
      - NODE_ENV=production
      # Experimental cable follow-ups; keep off until staging validation.
      - CONVERSATION_STATE_ENABLED=${CONVERSATION_STATE_ENABLED:-false}
      # Off is zero-network; shadow is inline. Fast replies require separate explicit routing opt-in.
      - JEV_MODE=${JEV_MODE:-off}
      - JEV_ROUTING_ENABLED=${JEV_ROUTING_ENABLED:-false}
      - JEV_ROUTING_SCOPE=${JEV_ROUTING_SCOPE:-off}
      - JEV_CANARY_PHONE=${JEV_CANARY_PHONE:-}
      - JEV_PROVIDER=${JEV_PROVIDER:-typesafe}
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY:-}
      - JEV_MODEL=${JEV_MODEL:-}
      - JEV_PRODUCT_QUALIFIER_MODE=${JEV_PRODUCT_QUALIFIER_MODE:-enforce}
      - JEV_TIMEOUT_MS=${JEV_TIMEOUT_MS:-1500}
      - JEV_MIN_CONFIDENCE=${JEV_MIN_CONFIDENCE:-0.7}
      - JEV_INPUT_USD_PER_MILLION=${JEV_INPUT_USD_PER_MILLION:-}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_LOG_LEVEL=warn
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - WAHA_API_KEY=${WAHA_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - ENGRAM_HOST=${ENGRAM_HOST:-host.docker.internal:7437}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Solo para embeber la consulta del cliente en la busqueda semantica (pgvector).
      # Si esta vacia, buscar_productos se salta esa capa y sigue funcionando igual.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Redirige el POST de embeddings al emisor real de la clave. Si la clave no es de
      # OpenAI (p.ej. "sk-or-" de OpenRouter) y esto queda vacio, el matcher omite la capa
      # vectorial en vez de mandarle el secreto a api.openai.com.
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      - N8N_DEFAULT_PRODUCTION_WORKFLOW_ACTIVE=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_OPTIONS=--max-old-space-size=1536
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_PG_DATABASE:-n8n}
      - DB_POSTGRESDB_USER=${N8N_PG_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${N8N_PG_PASSWORD}
      - DB_POSTGRESDB_POOL_SIZE=25
      - DB_POSTGRESDB_CONNECTION_TIMEOUT=60000
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=48
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=500
      # Solo se persisten las ejecuciones fallidas para acotar el crecimiento en PostgreSQL.
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      # n8n utiliza PostgreSQL (servicio postgres) como base de datos principal.
      # El volumen n8n_data permanece montado en /home/node/.n8n para conservar config
      # (encryptionKey) y preservar database.sqlite intacto como respaldo de reversión.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 2048m
    volumes:
      - n8n_data:/home/node/.n8n
      - /var/run/docker.sock:/var/run/docker.sock
      - ./n8n_workflow.json:/etc/n8n/n8n_workflow.json:ro
      - ./stickers:/data/stickers:ro
      - ./catalogos:/data/catalogos:ro
